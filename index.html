<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C63FF">
    <title>Pesquisa de Preço</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/login.css">

    <!-- Google API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    
    <!-- SheetJS: Para ler os arquivos .xlsx locais -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <header class="app-header" id="appHeader" style="display: none;">
        <div class="header-container">
            <h1 class="app-title"><i class="fas fa-barcode"></i> Pesquisa de Preço</h1>
            <div class="header-actions">
                <button id="btnRefresh" class="btn-icon" title="Recarregar Dados Locais"><i class="fas fa-sync-alt"></i></button>
                <button id="btnLogout" class="btn-icon" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </header>

    <main class="app-main" id="appMain" style="display: none;">
        <section class="scanner-section">
            <div class="scanner-container">
                <div class="manual-input-group">
                    <input type="text" id="inputCodigo" class="codigo-input" placeholder="Digite ou escaneie o código..." autocomplete="off">
                    <button id="btnScan" class="btn-scan"><i class="fas fa-camera"></i> Escanear</button>
                </div>
                <div id="scannerArea" class="scanner-area hidden">
                    <div id="qr-reader" class="qr-reader"></div>
                    <button id="btnStopScan" class="btn-stop-scan"><i class="fas fa-times"></i> Fechar Scanner</button>
                </div>
                <div class="search-group">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="inputBusca" class="search-input" placeholder="Buscar por descrição...">
                </div>
                <div id="resultadosBusca" class="search-results hidden"></div>
            </div>
        </section>

        <section id="produtoCard" class="produto-card hidden">
            <div class="card-header">
                <h2 class="produto-titulo">Produto Encontrado</h2>
                <button id="btnFecharCard" class="btn-icon"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="card-body">
                <div class="info-grid">
                    <div class="info-item"><span class="info-label">Código</span><span id="produtoCodigo" class="info-value"></span></div>
                    <div class="info-item"><span class="info-label">Descrição</span><span id="produtoDescricao" class="info-value"></span></div>
                    <div class="info-item"><span class="info-label">Comprador</span><span id="produtoComprador" class="info-value"></span></div>
                    <div class="info-item"><span class="info-label">Categoria</span><span id="produtoCategoria" class="info-value"></span></div>
                    <div class="info-item"><span class="info-label">Grupo</span><span id="produtoGrupo" class="info-value"></span></div>
                    <div class="info-item"><span class="info-label">Subgrupo</span><span id="produtoSubgrupo" class="info-value"></span></div>
                </div>

                <div class="editables-group">
                    <!-- Nosso Preço -->
                    <div class="editable-item" data-campo="nossoPreco">
                        <div class="editable-header">
                            <span class="editable-label"><i class="fas fa-tag"></i> Nosso Preço:</span>
                            <button class="btn-edit" data-campo="nossoPreco"><i class="fas fa-edit"></i> Editar</button>
                        </div>
                        <div class="editable-value" id="displayNossoPreco"></div>
                        <div class="editable-input hidden" data-campo="nossoPreco">
                            <input type="number" id="inputNossoPreco" step="0.01" placeholder="R$ 0,00">
                            <button class="btn-save" data-campo="nossoPreco"><i class="fas fa-check"></i> OK</button>
                        </div>
                    </div>

                    <!-- Preço Concorrente -->
                    <div class="editable-item" data-campo="precoConcorrente">
                        <div class="editable-header">
                            <span class="editable-label"><i class="fas fa-chart-line"></i> Preço Concorrente:</span>
                            <button class="btn-edit" data-campo="precoConcorrente"><i class="fas fa-edit"></i> Editar</button>
                        </div>
                        <div class="editable-value" id="displayPrecoConcorrente"></div>
                        <div class="editable-input hidden" data-campo="precoConcorrente">
                            <input type="number" id="inputPrecoConcorrente" step="0.01" placeholder="R$ 0,00">
                            <button class="btn-save" data-campo="precoConcorrente"><i class="fas fa-check"></i> OK</button>
                        </div>
                    </div>

                    <!-- Observação -->
                    <div class="editable-item" data-campo="observacao">
                        <div class="editable-header">
                            <span class="editable-label"><i class="fas fa-comment"></i> Observação:</span>
                            <button class="btn-edit" data-campo="observacao"><i class="fas fa-edit"></i> Editar</button>
                        </div>
                        <div class="editable-value" id="displayObservacao"></div>
                        <div class="editable-input hidden" data-campo="observacao">
                            <textarea id="inputObservacao" rows="2" placeholder="Digite aqui..."></textarea>
                            <button class="btn-save" data-campo="observacao"><i class="fas fa-check"></i> OK</button>
                        </div>
                    </div>
                </div>

                <button id="btnEnviarAlteracoes" class="btn-send-all" style="display: none;" disabled>
                    <i class="fas fa-upload"></i> Enviar Resultados <span class="badge" id="badgeAlteracoes">0</span>
                </button>
            </div>
        </section>

        <section class="historico-section">
            <div class="historico-header">
                <h2><i class="fas fa-history"></i> Histórico de Consultas</h2>
                <div class="historico-actions">
                    <button id="btnExportarCSV" class="btn-action"><i class="fas fa-file-csv"></i> CSV</button>
                    <button id="btnExportarPDF" class="btn-action"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button id="btnLimparHistorico" class="btn-action danger"><i class="fas fa-trash"></i> Limpar</button>
                </div>
            </div>
            <div id="historicoLista" class="historico-lista"></div>
        </section>
    </main>

    <div id="loadingSpinner" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p class="loading-text">Carregando...</p>
    </div>
    
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- ORDEM DE CARREGAMENTO -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/ui-core.js"></script>
    <script src="js/ui-login.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
