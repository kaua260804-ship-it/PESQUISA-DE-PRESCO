<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C63FF">
    <meta name="description" content="Sistema de Pesquisa de Preço com Leitor de Código de Barras">
    <title>Pesquisa de Preço - Leitor de Código de Barras</title>
    
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS do projeto -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header class="app-header">
        <div class="header-container">
            <h1 class="app-title">
                <i class="fas fa-barcode"></i>
                Pesquisa de Preço
            </h1>
            <button id="btnRefresh" class="btn-icon" title="Atualizar dados">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-main">
        <!-- Seção de Scanner -->
        <section class="scanner-section">
            <div class="scanner-container">
                <!-- Input manual -->
                <div class="manual-input-group">
                    <input 
                        type="text" 
                        id="inputCodigo" 
                        class="codigo-input" 
                        placeholder="Digite ou escaneie o código..."
                        autocomplete="off"
                        inputmode="numeric"
                        aria-label="Código de barras"
                    >
                    <button id="btnScan" class="btn-scan" title="Escanear código">
                        <i class="fas fa-camera"></i>
                        Escanear
                    </button>
                </div>

                <!-- Área do scanner -->
                <div id="scannerArea" class="scanner-area hidden">
                    <div id="qr-reader" class="qr-reader"></div>
                    <button id="btnStopScan" class="btn-stop-scan">
                        <i class="fas fa-times"></i>
                        Fechar Scanner
                    </button>
                </div>

                <!-- Área de busca -->
                <div class="search-group">
                    <i class="fas fa-search search-icon"></i>
                    <input 
                        type="text" 
                        id="inputBusca" 
                        class="search-input" 
                        placeholder="Buscar por código, descrição..."
                        autocomplete="off"
                    >
                </div>
                <div id="resultadosBusca" class="search-results hidden"></div>
            </div>
        </section>

        <!-- Card do Produto -->
        <section id="produtoCard" class="produto-card hidden">
            <div class="card-header">
                <h2 class="produto-titulo">Produto Encontrado</h2>
                <button id="btnFecharCard" class="btn-icon" title="Fechar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="card-body">
                <!-- Informações Básicas -->
                <div class="info-group">
                    <div class="info-item">
                        <span class="info-label">Código:</span>
                        <span id="produtoCodigo" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Descrição:</span>
                        <span id="produtoDescricao" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Comprador:</span>
                        <span id="produtoComprador" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Categoria:</span>
                        <span id="produtoCategoria" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Grupo:</span>
                        <span id="produtoGrupo" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Subgrupo:</span>
                        <span id="produtoSubgrupo" class="info-value"></span>
                    </div>
                </div>

                <!-- Campos Editáveis -->
                <div class="editables-group">
                    <!-- Nosso Preço -->
                    <div class="editable-item">
                        <div class="editable-header">
                            <span class="editable-label">
                                <i class="fas fa-tag"></i>
                                Nosso Preço:
                            </span>
                            <button class="btn-edit" data-campo="nossoPreco">
                                <i class="fas fa-edit"></i> Editar
                            </button>
                        </div>
                        <div class="editable-value" id="displayNossoPreco"></div>
                        <div class="editable-input hidden" data-campo="nossoPreco">
                            <input type="number" id="inputNossoPreco" step="0.01" min="0">
                            <button class="btn-save" data-campo="nossoPreco">
                                <i class="fas fa-check"></i> Salvar
                            </button>
                            <button class="btn-cancel" data-campo="nossoPreco">
                                <i class="fas fa-times"></i> Cancelar
                            </button>
                        </div>
                    </div>

                    <!-- Preço Concorrente -->
                    <div class="editable-item">
                        <div class="editable-header">
                            <span class="editable-label">
                                <i class="fas fa-chart-line"></i>
                                Preço Concorrente:
                            </span>
                            <button class="btn-edit" data-campo="precoConcorrente">
                                <i class="fas fa-edit"></i> Editar
                            </button>
                        </div>
                        <div class="editable-value" id="displayPrecoConcorrente"></div>
                        <div class="editable-input hidden" data-campo="precoConcorrente">
                            <input type="number" id="inputPrecoConcorrente" step="0.01" min="0">
                            <button class="btn-save" data-campo="precoConcorrente">
                                <i class="fas fa-check"></i> Salvar
                            </button>
                            <button class="btn-cancel" data-campo="precoConcorrente">
                                <i class="fas fa-times"></i> Cancelar
                            </button>
                        </div>
                    </div>

                    <!-- Observação -->
                    <div class="editable-item">
                        <div class="editable-header">
                            <span class="editable-label">
                                <i class="fas fa-comment"></i>
                                Observação:
                            </span>
                            <button class="btn-edit" data-campo="observacao">
                                <i class="fas fa-edit"></i> Editar
                            </button>
                        </div>
                        <div class="editable-value" id="displayObservacao"></div>
                        <div class="editable-input hidden" data-campo="observacao">
                            <textarea id="inputObservacao" rows="3"></textarea>
                            <button class="btn-save" data-campo="observacao">
                                <i class="fas fa-check"></i> Salvar
                            </button>
                            <button class="btn-cancel" data-campo="observacao">
                                <i class="fas fa-times"></i> Cancelar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Informações Adicionais -->
                <div class="info-group">
                    <div class="info-item">
                        <span class="info-label">Tipo de Código:</span>
                        <span id="produtoTipoCodigo" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Código de Acesso:</span>
                        <span id="produtoCodAcesso" class="info-value"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Histórico de Leituras -->
        <section class="historico-section">
            <div class="historico-header">
                <h2>
                    <i class="fas fa-history"></i>
                    Histórico de Leituras
                </h2>
                <div class="historico-actions">
                    <button id="btnExportarCSV" class="btn-action" title="Exportar CSV">
                        <i class="fas fa-file-csv"></i>
                        CSV
                    </button>
                    <button id="btnExportarPDF" class="btn-action" title="Exportar PDF">
                        <i class="fas fa-file-pdf"></i>
                        PDF
                    </button>
                    <button id="btnLimparHistorico" class="btn-action danger" title="Limpar Histórico">
                        <i class="fas fa-trash"></i>
                        Limpar
                    </button>
                </div>
            </div>
            <div id="historicoLista" class="historico-lista">
                <!-- Itens do histórico serão adicionados aqui -->
            </div>
        </section>
    </main>

    <!-- Loading Spinner (APENAS UM) -->
    <div id="loadingSpinner" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p class="loading-text">Carregando dados...</p>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Biblioteca html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- Scripts do projeto -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
